# Settings used by decode-lora.py and sondehub_uploader.py.

[lora]
# UKHAS/Pi In The Sky LoRa mode:
# 0 = telemetry, 1 = SSDV, 2 = repeater, 3 = fast SSDV,
# 4 = very fast test mode, 5 = calling mode
mode = 2
frequency_mhz = 434.100

# Generally the following settings should not be changed. Make sure the
# frequency and sync word match the balloon.
sync_word = 0x12
frequency_correction_ppm = -3
gain_tenths_db = 490
device = 0
# Modes 1 and 4 use an implicit header and normally contain 255-byte SSDV packets.
implicit_payload_length = 255

[telemetry]
# CSV columns transmitted by the balloon. The first six are required.
# Add optional names such as sats, temp, humidity, batt, speed, vel_h,
# vel_v, heading or pressure in the same order as the transmitted sentence.
fields = callsign, frame, time, lat, lon, alt
# If true, sentences must end in a valid UKHAS *FFFF checksum.
# The receiver already rejects packets that fail the LoRa packet CRC.
require_checksum = false
# Refuse stale telemetry; use 0 to disable this safety check.
max_time_difference_seconds = 300

[sondehub]
# Leave disabled while testing the receiver. Change the callsign before enabling.
enabled = false
uploader_callsign = CHANGE_ME
dev_mode = false
radio = RTL-SDR LoRa receiver
antenna = Antenna
contact_email = example@example.com

# Optional fixed receiver position. Set all three or leave all three blank.
# Enabling these publishes the receiver position on SondeHub's listener map.
station_latitude =
station_longitude =
station_altitude_m =

timeout_seconds = 10
retries = 3
telemetry_url = https://api.v2.sondehub.org/amateur/telemetry
listener_url = https://api.v2.sondehub.org/amateur/listeners

[web]
# The dashboard is available only on this Mac with the default host.
enabled = true
host = 127.0.0.1
port = 8080
max_packets = 500
